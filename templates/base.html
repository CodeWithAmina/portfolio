<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101412">
  <meta name="description"
    content="{% block description %}Amina Muhammed is an MCA student and aspiring full stack developer building thoughtful software projects.{% endblock %}">
  <title>{% block title %}Amina Muhammed — Developer Portfolio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="nav-shell container" aria-label="Main navigation">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Amina Muhammed, home">
        <span class="brand-mark">A</span>
        <span class="brand-name">amina<span class="brand-dot">.</span></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation"
        aria-label="Open navigation menu">
        <span></span><span></span>
      </button>
      <div class="nav-links" id="primary-navigation">
        <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ url_for('projects') }}" {% if request.endpoint == 'projects' %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ url_for('resume') }}" {% if request.endpoint == 'resume' %}aria-current="page"{% endif %}>Resume</a>
        <a class="nav-contact" href="{{ url_for('contact') }}">Let’s talk <span aria-hidden="true">↗</span></a>
      </div>
    </nav>
  </header>

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a class="brand footer-brand" href="{{ url_for('home') }}">
          <span class="brand-mark">A</span><span class="brand-name">amina<span class="brand-dot">.</span></span>
        </a>
        <p>MCA student · Aspiring full stack developer</p>
      </div>
      <div class="footer-links" aria-label="Footer navigation">
        <a href="{{ url_for('projects') }}">Projects</a>
        <a href="{{ url_for('resume') }}">Resume</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="https://github.com/aminamuhammed" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        <a href="https://linkedin.com/in/aminamuhammed" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
      </div>
      <p class="copyright">© {{ current_year }} Amina Muhammed</p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>

</html>
